
# pyproject.toml

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "material-scaleup"
version = "0.1.0"
description = "AI-assisted assessment of scale-up feasibility for novel materials."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "requests>=2.31,<3.0",
    "pandas>=3.0,<4.0",
    "openpyxl>=3.1,<4.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

ai = [
    "openai>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that make requests to external services or APIs",
]


[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
